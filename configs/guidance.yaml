# S4/S5 使用的引导超参数（与 base.yaml 合并）
extends: diffusion_train.yaml

seed: 20261103
device: cpu            # 引导阶段风险 DP 在 CPU 上更快（小张量 + 96 步串行）
dtype: float32

diffusion:
  ddim_sampling_steps: 40
  guidance_start_fraction: 0.25
  guidance_updates_per_step: 1

guidance:
  lambda_R: 1.0
  lambda_T: 0.05
  lambda_S: 10.0
  lambda_K: 1.0
  lambda_G: 0.5
  lambda_W: 0.01
  lambda_tail_s: 2.0
  grad_clip_norm: 1.0
  guidance_step_x: 0.05
  guidance_step_w: 0.50
  endpoint_grad_mask: true

benchmark:
  scale: 0.2
  tasks_per_cell: 5
  robot_counts: [2, 4, 6]
  pause_probabilities: [0.0, 0.05, 0.10, 0.20]
  execution_repeats: 30
  methods: [B0, B1, B2, B3, A1, A2, A3]
  ddim_steps: 20
  risk_weight_tuning: false
